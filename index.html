<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e20">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%23c8a35a%22/%3E%3Cpath d=%22M32 12l12 20-12 20-12-20z%22 fill=%22%23a062e8%22/%3E%3C/svg%3E">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>星晶守護者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=Oxanium:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#0c0e20;--ink2:#12152c;--panel:#161a36;--panel2:#1d2245;--line:#2d3361;--line2:#414a85;
  --text:#ece9f8;--muted:#a3a1c7;--dim:#6f6d98;
  --brass:#c8a35a;--brass2:#ecd49a;
  --r:#e5533f;--u:#3b87ea;--g:#2db46e;--y:#eab935;--p:#a062e8;--w:#e3e8f4;--c:#ff8a4c;
  --ok:#5fd39a;--bad:#ff7a6b;
  --fd:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --fb:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fn:"Oxanium","Noto Sans TC",ui-monospace,monospace;
}
html,body{height:auto;background:var(--ink);color:var(--text)}
body{font-family:var(--fb);font-size:14px;line-height:1.5;
  background:
   radial-gradient(1100px 560px at 75% -8%,#2b2462 0%,transparent 60%),
   radial-gradient(900px 520px at -12% 108%,#16345a 0%,transparent 55%),
   var(--ink);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 68% 32%,#fff6 50%,transparent 51%),radial-gradient(1.2px 1.2px at 38% 72%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 88% 82%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 52% 8%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 22% 56%,#fff4 50%,transparent 51%);
  background-size:340px 300px}
button{font:inherit;color:inherit;touch-action:manipulation}
html{touch-action:manipulation}
.tok,.tokw,.card,.deck{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}

.k-r{--gc:var(--r)}.k-u{--gc:var(--u)}.k-g{--gc:var(--g)}.k-y{--gc:var(--y)}.k-p{--gc:var(--p)}.k-w{--gc:var(--w)}.k-c{--gc:var(--c)}

.app{position:relative;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand h1{margin:0;font-family:var(--fd);font-weight:900;font-size:24px;letter-spacing:.12em;background:linear-gradient(180deg,#fff 10%,var(--brass2) 60%,var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.18em}
.turninfo{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.turninfo b{color:var(--text);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);background:var(--panel)}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brass);background:#262c57}
.btn.primary{background:linear-gradient(180deg,#e9cf8f,#b98f42);color:#1b1530;border-color:#e9cf8f;font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:12.5px}

.board{grid-area:auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:14px;padding:12px}
.ptitle{font-size:11.5px;letter-spacing:.2em;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}

.toast{min-height:34px;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:10px;background:#0f1230;border:1px dashed var(--line2);font-size:13px;color:var(--muted)}
.toast b{color:var(--text)}
.toast.flash{animation:flash .6s ease}
@keyframes flash{from{background:#2a2a5a}to{background:#0f1230}}

.extras{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.loc .lsub svg{width:11px;height:11px;fill:var(--brass2);vertical-align:-1px}
@media (max-width:620px){.extras{grid-template-columns:repeat(var(--m),minmax(0,1fr))}}
.loc{position:relative;border-radius:10px;padding:7px 8px 8px;background:linear-gradient(180deg,#232a52,#181c3b);border:1px solid var(--line2);min-height:74px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.loc .lname{font-family:var(--fd);font-weight:700;font-size:12.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.loc .lpts{position:absolute;top:5px;right:7px;font-family:var(--fn);font-weight:700;font-size:16px;color:var(--brass2)}
.loc .req{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.rq{display:inline-grid;place-items:center;width:20px;height:24px;font-family:var(--fn);font-weight:700;font-size:12px;color:#fff;text-shadow:0 1px 1px #000a;border-radius:4px;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 70%,white) 0%,var(--gc) 40%,color-mix(in srgb,var(--gc) 55%,black))}
.k-y.rq,.k-w.rq{color:#1b1a2e;text-shadow:none}
.loc.ally{background:linear-gradient(180deg,#3a2f22,#1f1a26);border-color:#7a6236}
.loc.ally .lname{color:var(--brass2)}
.loc .lsub{font-size:11px;color:var(--muted);line-height:1.3}
.loc.gone{opacity:.35}

.tier{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.deck{position:relative;aspect-ratio:5/7;border-radius:9px;border:1px solid var(--line2);cursor:pointer;padding:0;overflow:hidden;
  background:repeating-linear-gradient(45deg,#1a1f44 0 6px,#161a39 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;container-type:inline-size}
.deck::before{content:"";position:absolute;inset:7%;border:1px solid color-mix(in srgb,var(--brass) 55%,transparent);border-radius:6px}
.deck .roman{font-family:var(--fd);font-weight:900;font-size:26cqw;color:var(--brass2);letter-spacing:.05em}
.deck .cnt{font-family:var(--fn);font-size:14cqw;color:var(--muted)}
.deck.empty{opacity:.35;cursor:default}
.slot{aspect-ratio:5/7;border-radius:9px;border:1px dashed var(--line)}

.card{position:relative;container-type:inline-size;isolation:isolate;aspect-ratio:5/7;width:100%;border-radius:9px;padding:0;cursor:pointer;overflow:hidden;text-align:left;display:block;
  border:1px solid color-mix(in srgb,var(--gc) 60%,transparent);
  background:linear-gradient(165deg,color-mix(in srgb,var(--gc) 44%,#141733) 0%,#141733 60%,#0e1027 100%);
  box-shadow:0 3px 10px #0006;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px)}
.card.t3{border-color:color-mix(in srgb,var(--brass) 80%,transparent);box-shadow:0 3px 10px #0006,inset 0 0 0 1px #0000,inset 0 0 18px -6px var(--brass)}
.card.can{box-shadow:0 0 0 2px var(--ok),0 0 16px -3px var(--ok)}
.card.fresh{animation:deal .5s cubic-bezier(.2,.8,.3,1.2)}
@keyframes deal{from{transform:translateY(-14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.ctop,.cicons,.ccost,.cname{z-index:1}
.ctop{position:absolute;left:8cqw;right:8cqw;top:6cqw;display:flex;justify-content:space-between;align-items:flex-start}
.cpts{font-family:var(--fn);font-weight:700;font-size:32cqw;line-height:.95;text-shadow:0 2px 0 #0009;min-height:30cqw}
.gem{position:relative;width:20cqw;aspect-ratio:1;margin:5cqw 4cqw 0 0;transform:rotate(45deg);border-radius:2px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 45%,white) 0%,var(--gc) 45%,color-mix(in srgb,var(--gc) 55%,black) 100%);box-shadow:0 0 0 1px #0006}
.gem.core{box-shadow:0 0 0 2cqw #0e1027,0 0 0 3.6cqw #fff,0 0 12cqw 2cqw var(--c)}
.cicons{position:absolute;left:8cqw;top:44cqw;display:flex;gap:2cqw}
.cicons svg{width:14cqw;height:14cqw;fill:var(--brass2);filter:drop-shadow(0 1px 0 #0008)}
.cimg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cname{position:absolute;right:6cqw;bottom:5cqw;left:36cqw;text-align:right;font-family:var(--fd);font-weight:700;font-size:10.5cqw;letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:88px){.cname{display:none}}
.ccost{position:absolute;left:7cqw;bottom:6cqw;display:flex;flex-direction:column-reverse;gap:2.5cqw}
.chip{width:22cqw;height:22cqw;border-radius:50%;display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:14cqw;line-height:1;color:#fff;text-shadow:0 1px 1px #000b;
  background:radial-gradient(circle at 38% 34%,color-mix(in srgb,var(--gc) 55%,white),var(--gc) 55%,color-mix(in srgb,var(--gc) 55%,black));box-shadow:0 0 0 1px #0008}
.k-y.chip,.k-w.chip{color:#1b1a2e;text-shadow:none}
.chip.have{width:17cqw;height:17cqw;margin:2.5cqw;border-radius:2.5cqw;transform:rotate(45deg);background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 45%,white) 0%,var(--gc) 45%,color-mix(in srgb,var(--gc) 55%,black) 100%);box-shadow:0 0 0 1px #0009,0 0 0 1.8cqw #ffffffcc}
.chip.have span{transform:rotate(-45deg)}

.side{display:contents}
.board{order:1}
.bank{order:2}
.me{order:3}
.opp{order:4}
.logp{order:5}

.tokens{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;justify-items:center}
.tokw{display:flex;flex-direction:column;align-items:center;gap:4px}
.tok{position:relative;width:54px;height:60px;border:none;padding:0;background:none;cursor:pointer;transition:transform .15s,filter .15s;filter:drop-shadow(0 4px 6px #0008)}
.tok svg{width:100%;height:100%;display:block;overflow:visible}
.tok:hover{transform:translateY(-2px)}
.tok.sel{transform:translateY(-6px);filter:drop-shadow(0 0 7px var(--brass2)) drop-shadow(0 8px 8px #000a)}
.tok.zero{opacity:.35}
.tok .badge{position:absolute;top:-8px;right:-12px;min-width:20px;height:20px;border-radius:10px;background:var(--brass2);color:#1b1530;font-family:var(--fn);font-weight:700;font-size:12px;display:grid;place-items:center;padding:0 5px;z-index:2;box-shadow:0 2px 4px #0008}
.tlab{font-size:11px;color:var(--muted);letter-spacing:.08em}
.takebar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;min-height:34px}
.takebar .msg{font-size:12.5px;color:var(--muted);margin-right:auto}

.plist{display:flex;flex-direction:column;gap:8px}
.pc{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#12162f}
.pc.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.pc .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pc .pname{font-weight:700;font-size:13.5px}
.pc .ptag{font-size:11px;color:var(--muted)}
.pc .pscore{margin-left:auto;font-family:var(--fn);font-weight:700;font-size:20px;color:var(--brass2)}
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) auto;gap:4px;align-items:center}
.mc{display:flex;flex-direction:column;align-items:center;gap:2px}
.md{width:14px;height:14px;transform:rotate(45deg);border-radius:2px;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 45%,white),var(--gc) 45%,color-mix(in srgb,var(--gc) 55%,black));display:grid;place-items:center}
.md.none{opacity:.25}
.mc .v{font-family:var(--fn);font-size:12px;line-height:1.1}
.mc .v.tk{color:var(--muted)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.meta b{color:var(--text);font-family:var(--fn)}
.thinking{font-size:11px;color:var(--brass2);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}

.me .mehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.me .mename{font-family:var(--fd);font-weight:900;font-size:18px;letter-spacing:.08em}
.me .bigscore{font-family:var(--fn);font-weight:700;font-size:34px;line-height:1;color:var(--brass2)}
.me .bigscore small{font-size:14px;color:var(--muted);margin-left:2px}
.goals{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.goal{font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.goal.done{border-color:var(--ok);color:var(--ok)}
.ledger{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.lc{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px;border-radius:10px;background:#11152d;border:1px solid var(--line)}
.lc .bd{width:24px;height:24px;transform:rotate(45deg);border-radius:3px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 45%,white),var(--gc) 45%,color-mix(in srgb,var(--gc) 55%,black))}
.lc .bd span{transform:rotate(-45deg);font-family:var(--fn);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 1px #000a}
.k-y.bd span,.k-w.bd span{color:#1b1a2e;text-shadow:none}
.lc .tc{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--fn);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 1px #000a;background:radial-gradient(circle at 38% 32%,color-mix(in srgb,var(--gc) 50%,white),var(--gc) 58%,color-mix(in srgb,var(--gc) 55%,black));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gc) 50%,black),inset 0 0 0 3.5px #ffffff55,inset 0 0 0 5px color-mix(in srgb,var(--gc) 70%,black),0 2px 0 color-mix(in srgb,var(--gc) 45%,black),0 3px 3px #0007}
.k-y.tc,.k-w.tc{color:#1b1a2e;text-shadow:none}
.lc .none{opacity:.28}
.lc .ll{font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.lc.core .bd{background:conic-gradient(from 45deg,#ff6b6b,#ffd166,#6ee7a8,#63b3ff,#c38bff,#ff6b6b)}
.lc.btn-ret{cursor:pointer;border-color:var(--bad)}
.merow{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;align-items:flex-start}
.resv{display:grid;grid-template-columns:repeat(3,72px);gap:7px}
.resv .slot{width:72px}
.mebtns{display:flex;gap:8px;margin-left:auto;align-items:flex-end;flex-wrap:wrap}
.sublab{font-size:11px;color:var(--muted);letter-spacing:.15em;margin-bottom:5px}
.hintbox{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:9px;background:#221f3f;border:1px solid #5b4b8a}

.log{max-height:220px;overflow:auto;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;padding-right:4px}
.log div b{color:var(--text);font-weight:500}

.ov{position:fixed;inset:0;z-index:50;background:#070816cc;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{width:min(460px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:18px;box-shadow:0 20px 60px #000a;max-height:calc(100% - 20px);overflow:auto}
.sheet h2{margin:0 0 4px;font-family:var(--fd);font-weight:900;font-size:21px;letter-spacing:.08em}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.sheet .row{display:flex;gap:16px;align-items:flex-start}
.sheet .big{width:150px;flex:none}
.sheet .info{font-size:13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pay{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pay .rq{width:auto;padding:0 6px;height:22px}
.warn{color:var(--bad)}
.good{color:var(--ok)}
@media (max-width:420px){.sheet .row{flex-direction:column;align-items:center}.sheet .big{width:140px}}

.setup{width:min(520px,100%)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:none;background:transparent;padding:7px 16px;cursor:pointer;font-family:var(--fn);font-weight:700}
.seg button.on{background:var(--brass);color:#1b1530}
.seat{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.seat .no{font-family:var(--fn);color:var(--brass2);font-weight:700;text-align:center}
.seat input,.seat select{width:100%;box-sizing:border-box;background:#0f1230;border:1px solid var(--line2);border-radius:8px;padding:8px 9px;color:var(--text);font:inherit;font-size:13.5px}
.rules{font-size:13.5px;line-height:1.7}
.rules h3{font-family:var(--fd);font-size:15px;margin:14px 0 4px;color:var(--brass2);letter-spacing:.08em}
.rules ul{margin:0;padding-left:20px}
.rank{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rank .ri{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:#12162f;border:1px solid var(--line)}
.rank .ri.win{border-color:var(--brass);background:linear-gradient(90deg,#3a2f22,#12162f)}
.rank .pos{font-family:var(--fn);font-weight:700;font-size:18px;width:22px;color:var(--brass2)}
.rank .sc{margin-left:auto;font-family:var(--fn);font-weight:700;font-size:20px}


.tabs{display:flex;gap:4px;margin:4px 0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brass2);border-bottom-color:var(--brass2)}
.fld{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.fld input{flex:1;min-width:0;box-sizing:border-box;background:#0f1230;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;font-size:14px}
.fld input.code{font-family:var(--fn);font-weight:700;letter-spacing:.3em;text-transform:uppercase;max-width:150px}
.grp{margin-top:16px}
.rooms{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.roomrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#12162f;border:1px solid var(--line);font-size:13px}
.roomrow .rc{font-family:var(--fn);font-weight:700;letter-spacing:.15em;color:var(--brass2)}
.roomrow .rm{color:var(--muted);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.errmsg{font-size:12.5px;color:var(--bad);margin-top:8px}
.bigcode{font-family:var(--fn);font-weight:700;font-size:40px;letter-spacing:.25em;color:var(--brass2);line-height:1}
.lseat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#12162f;border:1px solid var(--line);margin-top:6px;font-size:13.5px}
.lseat .no{font-family:var(--fn);color:var(--brass2);font-weight:700;width:16px}
.lseat .nm{margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lseat select{background:#0f1230;border:1px solid var(--line2);border-radius:7px;padding:5px 6px;color:var(--text);font:inherit;font-size:12.5px}
.tagx{font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pill.net{border-color:#3f6f8a;color:#9fdcff}


.panel.me.myturn{border-color:var(--brass2);box-shadow:0 0 0 1px var(--brass2) inset,0 0 26px -4px #ecd49a88;animation:myglow 1.6s ease-in-out infinite alternate}
.panel.bank.myturn{border-color:#ecd49a99;box-shadow:0 0 18px -6px #ecd49a88}
@keyframes myglow{from{box-shadow:0 0 0 1px var(--brass2) inset,0 0 14px -6px #ecd49a66}to{box-shadow:0 0 0 1px var(--brass2) inset,0 0 30px -2px #ecd49acc}}
.turnflag{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,#e9cf8f,#c79a45);color:#1b1530;font-weight:700;font-size:14.5px;letter-spacing:.04em}
.tf-dot{width:10px;height:10px;border-radius:50%;background:#1b1530;animation:pulse .7s infinite alternate;flex:none}
#turnbanner{position:fixed;left:0;right:0;top:28%;z-index:60;display:grid;place-items:center;pointer-events:none}
#turnbanner .tb-in{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 44px;border-radius:16px;background:linear-gradient(180deg,#f3dea6,#c79a45);color:#1b1530;box-shadow:0 20px 60px #000c,0 0 0 2px #fff6 inset;animation:tbin 1.9s cubic-bezier(.2,.9,.3,1.2) forwards}
#turnbanner small{font-size:12px;letter-spacing:.3em;font-weight:700;opacity:.7}
#turnbanner b{font-family:var(--fd);font-weight:900;font-size:34px;letter-spacing:.14em}
@keyframes tbin{0%{transform:scale(.6);opacity:0}14%{transform:scale(1.06);opacity:1}24%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
@media (min-width:980px){
  .app{grid-template-columns:minmax(0,640px) minmax(340px,1fr);grid-template-areas:"top top" "board side" "bank side";grid-template-rows:auto auto 1fr;align-items:start}
  .top{grid-area:top}
  .board{grid-area:board}
  .bank{grid-area:bank}
  .side{display:flex;flex-direction:column;gap:14px;grid-area:side}
  .log{max-height:300px}
}
@media (max-width:520px){
  .tok{width:48px;height:54px}
  .tier{gap:5px}
  .brand h1{font-size:21px}
  .ledger{gap:4px}
  .resv{grid-template-columns:repeat(3,64px)}.resv .slot{width:64px}
  .mebtns{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// ================= engine =================
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mkCards(){
  const out={1:[],2:[],3:[]};let id=0;
  for(const t of [1,2,3]){
    C.forEach((col,ci)=>{
      const others=[1,2,3,4].map(k=>C[(ci+k)%5]);
      PAT[t].forEach((p,j)=>{
        const [pts,cp,icons,core,role]=p;
        const o=[0,1,2,3].map(m=>others[(m+j+ci)%4]);
        const cost={};
        for(const key in cp){const c=key==='own'?col:o[+key[1]];cost[c]=(cost[c]||0)+cp[key]}
        out[t].push({id:id++,tier:t,color:col,pts,cost,icons,core:!!core,name:TITLE[col]+role,role});
      });
    });
    shuffle(out[t]);
  }
  return out;
}

let G=null;
let MODE='local';
const UI={sel:[],sheet:null,hint:null,anim:new Set(),rules:false,menu:null,flash:false,lastHuman:0,viewBoard:false,toast:''};
const SAVE='xjsh-save-v2';
let timer=null;

function newGame(seats){
  const n=seats.length;
  const per=n===2?4:n===3?5:7;
  const decks=mkCards();
  const market={};for(const t of [1,2,3])market[t]=[0,1,2,3].map(()=>decks[t].pop());
  const bank={};C.forEach(c=>bank[c]=per);bank.w=5;
  G={
    players:seats.map(s=>({name:s.name,uid:s.uid||null,type:s.type,level:s.level||0,tokens:{r:0,u:0,g:0,y:0,p:0,w:0},bonus:{r:0,u:0,g:0,y:0,p:0},core:0,icons:0,cardPts:0,cards:0,reserved:[],locs:[]})),
    bank,decks,market,locations:shuffle(LOCS.map(([name,req])=>({name,req}))).slice(0,n+1),
    ally:null,cur:0,round:1,finalRound:false,over:false,phase:'act',passStreak:0,log:[],last:'遊戲開始，由 '+esc(seats[0].name)+' 先手。',turnId:0,winner:null
  };
  UI.sel=[];UI.hint=null;UI.anim=new Set();UI.viewBoard=false;
  for(const t of [1,2,3])G.market[t].forEach(c=>c&&UI.anim.add(c.id));
  addLog(`<b>新局開始</b>：${n} 位玩家`);
  UI.lastHuman=Math.max(0,G.players.findIndex(p=>p.type==='human'));
  return G;
}
function addLog(s){G.log.unshift(s);if(G.log.length>60)G.log.pop()}
function save(){if(MODE!=='local')return;try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(SAVE);if(!s)return null;const g=JSON.parse(s);return g&&g.players?g:null}catch(e){return null}}

const P=i=>G.players[i];
const tokTotal=p=>ALL.reduce((s,k)=>s+p.tokens[k],0);
function score(i){const p=P(i);return p.cardPts+3*p.locs.length+(G.ally===i?3:0)}
function meetsWin(i){const p=P(i);return score(i)>=WIN&&C.every(c=>p.bonus[c]>0)&&p.core>0}
function needOf(p,c){const n={};for(const k of C)n[k]=Math.max(0,(c.cost[k]||0)-p.bonus[k]);return n}
function shortfall(p,c){const n=needOf(p,c);let s=0;for(const k of C)s+=Math.max(0,n[k]-p.tokens[k]);return Math.max(0,s-p.tokens.w)}
const canAfford=(p,c)=>shortfall(p,c)===0;
function payPlan(p,c){const n=needOf(p,c);const parts=[];let gap={},wild=0;for(const k of C){if(!n[k])continue;const use=Math.min(n[k],p.tokens[k]);if(use)parts.push([k,use]);const rest=n[k]-use;if(rest){gap[k]=rest;wild+=rest}}return{parts,wildUse:Math.min(wild,p.tokens.w),gap,short:Math.max(0,wild-p.tokens.w)}}
function draw(t){return G.decks[t].length?G.decks[t].pop():null}

function doTake(i,cols){const p=P(i);for(const k of cols){G.bank[k]--;p.tokens[k]++}
  const txt=cols.length===2&&cols[0]===cols[1]?`2 顆${CN[cols[0]]}`:cols.map(k=>CN[k]).join('、');
  return `${nm(p)} 拿取了 ${txt}`}
function doBuy(i,src,t,idx){const p=P(i);const c=src==='m'?G.market[t][idx]:p.reserved[idx];
  const n=needOf(p,c);for(const k of C){const use=Math.min(n[k],p.tokens[k]);p.tokens[k]-=use;G.bank[k]+=use;const rest=n[k]-use;p.tokens.w-=rest;G.bank.w+=rest}
  p.bonus[c.color]++;p.cardPts+=c.pts;p.icons+=c.icons;if(c.core)p.core++;p.cards++;
  if(src==='m')G.market[t][idx]=draw(t);else p.reserved.splice(idx,1);
  return `${nm(p)} 招募了 ${c.name}（${CN[c.color]}${c.pts?`・${c.pts} 分`:''}${c.core?'・星核':''}）`}
function doReserve(i,t,idx){const p=P(i);let c;
  if(idx<0){c=draw(t)}else{c=G.market[t][idx];G.market[t][idx]=draw(t)}
  p.reserved.push(c);let got='';if(G.bank.w>0){G.bank.w--;p.tokens.w++;got='，獲得 1 顆星塵'}
  return idx<0?`${nm(p)} 從第 ${ROMAN[t]} 階牌堆保留了一張卡${got}`:`${nm(p)} 保留了 ${c.name}${got}`}

function apply(i,a){
  let msg='';
  if(a.type==='take')msg=doTake(i,a.cols);
  else if(a.type==='buy')msg=doBuy(i,a.src,a.t,a.idx);
  else if(a.type==='reserve')msg=doReserve(i,a.t,a.idx);
  else msg=`${nm(P(i))} 無法行動，跳過回合`;
  G.passStreak=a.type==='pass'?G.passStreak+1:0;
  G.last=msg;addLog(msg);UI.flash=true;UI.sel=[];UI.hint=null;UI.sheet=null;
  if(tokTotal(P(i))>MAXTOK){
    if(P(i).type==='human'){G.phase='discard';persist();return}
    aiDiscard(i);
  }
  finishTurn(i);
}
function finishTurn(i){
  const p=P(i);G.phase='act';
  const q=G.locations.findIndex(L=>Object.entries(L.req).every(([k,v])=>p.bonus[k]>=v));
  if(q>=0){const L=G.locations.splice(q,1)[0];p.locs.push(L);addLog(`${nm(p)} 解放了據點「${L.name}」＋3 分`);G.last+=`；解放了據點「${L.name}」`}
  if(p.icons>=ALLY_MIN&&G.ally!==i&&(G.ally===null||p.icons>P(G.ally).icons)){
    const prev=G.ally;G.ally=i;addLog(prev===null?`${nm(p)} 取得「星盟之證」＋3 分`:`${nm(p)} 從 ${esc(P(prev).name)} 手中奪走「星盟之證」`);G.last+='；取得「星盟之證」'}
  if(!G.finalRound&&meetsWin(i)){G.finalRound=true;addLog(`${nm(p)} 達成勝利條件！本輪結束後遊戲結束`)}
  const n=G.players.length;
  G.cur=(G.cur+1)%n;G.turnId++;G.turnAt=Date.now();
  if(G.cur===0)G.round++;
  if((G.finalRound&&G.cur===0)||G.passStreak>=n*2)endGame();
  if(P(G.cur).type==='human')UI.lastHuman=G.cur;
  persist();
}
function endGame(){
  G.over=true;
  const idx=G.players.map((_,i)=>i);
  const elig=idx.filter(meetsWin);const pool=elig.length?elig:idx;
  pool.sort((a,b)=>score(b)-score(a)||P(a).cards-P(b).cards);
  G.winner=pool[0];
  addLog(`<b>遊戲結束</b>：${esc(P(pool[0]).name)} 獲勝`);
}
function persist(){
  if(MODE==='online'){render();if(NET.role==='host'){saveHost();broadcast();schedule()}return}
  save();render();schedule();
}

// ---------- AI ----------
function visible(i){const p=P(i);const v=[];for(const t of [1,2,3])G.market[t].forEach((c,idx)=>c&&v.push({c,src:'m',t,idx}));p.reserved.forEach((c,idx)=>v.push({c,src:'r',t:c.tier,idx}));return v}
function demand(i,vis){const p=P(i);const d={r:0,u:0,g:0,y:0,p:0};for(const v of vis)for(const k of C)if((v.c.cost[k]||0)>p.bonus[k])d[k]++;
  for(const L of G.locations)for(const k in L.req)if(p.bonus[k]<L.req[k])d[k]+=1.5;return d}
function cardValue(i,c,dem,lvl){
  const p=P(i);const prog=Math.min(1,score(i)/WIN);
  let v=c.pts*3+(1-prog)*1.3;
  for(const L of G.locations){if(L.req[c.color]&&p.bonus[c.color]<L.req[c.color]){const left=Object.entries(L.req).reduce((s,[k,x])=>s+Math.max(0,x-p.bonus[k]),0);v+=(lvl>=3?1.6:1)*Math.max(.3,1.8-left*.2)}}
  if(c.icons){const leader=G.ally===null?0:P(G.ally).icons;v+=c.icons*(G.ally===i?.25:(p.icons+c.icons>=Math.max(ALLY_MIN,leader+1)?1.6:.7))}
  if(p.bonus[c.color]===0)v+=.4+prog*2.5;
  if(c.core&&p.core===0)v+=1+prog*5;
  v+=dem[c.color]*.07;
  if(lvl===1)v+=Math.random()*3;
  return v;
}
function feasible(p,c){const n=needOf(p,c);let extra=0;for(const k of C){const lack=n[k]-p.tokens[k]-G.bank[k];if(lack>0)extra+=lack}return extra<=p.tokens.w+G.bank.w}
function aiDecide(i){
  const p=P(i);const lvl=p.level||2;const vis=visible(i);const dem=demand(i,vis);const prog=Math.min(1,score(i)/WIN);
  const buys=vis.filter(v=>canAfford(p,v.c)).map(v=>({...v,val:cardValue(i,v.c,dem,lvl)})).sort((a,b)=>b.val-a.val);
  let tg=vis.filter(v=>!canAfford(p,v.c)&&feasible(p,v.c)).map(v=>{const sf=shortfall(p,v.c);const turns=Math.ceil(sf/(lvl>=3?2.7:2.4))+1;const val=cardValue(i,v.c,dem,lvl);return{...v,val,turns,sc:val/Math.pow(turns,lvl>=3?1.1:1)}}).sort((a,b)=>b.sc-a.sc);
  if(lvl===1&&Math.random()<.3)shuffle(tg);
  const T=tg[0],T2=tg[1];
  if(buys.length){const b=buys[0];
    if(!T||b.c.pts>0||b.val>=1.1||b.val>=T.sc*.8||(prog>.75&&(b.c.core||p.bonus[b.c.color]===0)))return{type:'buy',src:b.src,t:b.t,idx:b.idx,why:b};
  }
  if(lvl>=2&&p.core===0&&prog>=.45&&p.reserved.length<MAXRES&&!p.reserved.some(c=>c.core)){
    const cc=vis.filter(v=>v.src==='m'&&v.c.core).sort((a,b)=>shortfall(p,a.c)-shortfall(p,b.c))[0];
    if(cc)return{type:'reserve',t:cc.t,idx:cc.idx,why:cc};
  }
  if(T){
    const plan=planTake(p,T,T2);
    if(plan&&plan.length)return{type:'take',cols:plan,why:T};
    if(p.reserved.length<MAXRES&&T.src==='m')return{type:'reserve',t:T.t,idx:T.idx,why:T};
  }
  if(buys.length){const b=buys[0];return{type:'buy',src:b.src,t:b.t,idx:b.idx,why:b}}
  const avail=C.filter(k=>G.bank[k]>0);
  if(avail.length&&tokTotal(p)<MAXTOK)return{type:'take',cols:shuffle(avail).slice(0,Math.min(3,MAXTOK-tokTotal(p)))};
  if(p.reserved.length<MAXRES){for(const t of [3,2,1]){const idx=G.market[t].findIndex(c=>c);if(idx>=0)return{type:'reserve',t,idx}}}
  if(avail.length)return{type:'take',cols:shuffle(avail).slice(0,3)};

  const wanted=C.filter(k=>G.bank[k]>0&&w[k]>0).sort((a,b)=>w[b]-w[a]||G.bank[b]-G.bank[a]);
  if(!wanted.length)return null;

  if(w[k0]>=2&&G.bank[k0]>=4&&room>=2&&(wanted.length===1||room<3))return[k0,k0];
  const pick=wanted.slice(0,3);

// ---- host ----
function hostCreate(cap){
  if(!hasPeer()){NET.err='連線元件載入失敗，請重新整理頁面。';renderOverlay();return}
  NET.err='';const code=genCode();
  const doc={code,status:'lobby',host:NET.myId,hostNick:nick(),cap,seats:Array.from({length:cap},(_,i)=>i===0?{uid:NET.myId,nick:nick(),type:'human'}:{uid:null,nick:'',type:'open'})};

function openHost(code,doc,g,resume){
  leaveNet(true);
  MODE='online';NET.role='host';NET.code=code;NET.doc=doc;NET.online=new Set([NET.myId]);NET.resuming=resume;NET.status='建立房間中…';
  G=g;UI.menu=null;UI.sheet=null;UI.viewBoard=false;clearTimeout(timer);
  if(G){const me=G.players.findIndex(p=>p.uid===NET.myId);UI.lastHuman=me>=0?me:0}
  render();

  const start=()=>{
    const peer=new Peer(PREFIX+code,peerOpts());NET.peer=peer;
    peer.on('open',()=>{NET.status='';saveHost();setLastRoom(null);render();schedule()});
    peer.on('connection',conn=>{
      conn.on('data',d=>hostRecv(conn,d));
      const drop=()=>{const c=NET.conns.get(conn.peer);if(c&&c.conn===conn){NET.conns.delete(conn.peer);refreshOnline();broadcast();render()}};
      conn.on('close',drop);conn.on('error',drop);

    peer.on('error',e=>{
      if(NET.peer!==peer)return;
      if(e.type==='unavailable-id'){
        peer.destroy();
        if(resume&&tries<20){tries++;NET.status='正在重新開啟房間 '+code+'…';render();setTimeout(()=>{if(NET.role==='host'&&NET.code===code)start()},3000);return}
        if(!resume&&!G){const nc=genCode();NET.code=code=nc;NET.doc.code=nc;start();return}
        NET.err='這個房號正在使用中，請稍後再試。';exitOnline();return;
      }
      if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'){NET.status=peerErr(e);render();return}
      if(e.type==='browser-incompatible'){NET.err=peerErr(e);exitOnline();return}
    });
  };

}
function refreshOnline(){NET.online=new Set([NET.myId,...[...NET.conns.values()].map(c=>c.pid).filter(Boolean)])}

function broadcast(){
  if(NET.role!=='host')return;
  const msg={t:'sync',doc:NET.doc,G:G,online:[...NET.online],ver:APP_VER};
  for(const {conn} of NET.conns.values())sendTo(conn,msg);
}
function hostRecv(conn,d){
  if(!d||typeof d!=='object')return;

    const pid=String(d.pid||'').slice(0,40),name=String(d.name||'玩家').slice(0,10)||'玩家';
    if(!pid)return;
    if(d.ver!==APP_VER){sendTo(conn,{t:'err',msg:`你的遊戲版本（${d.ver||'舊版'}）和房主（${APP_VER}）不同。請關掉這個分頁，重新打開遊戲網址後再加入。`,fatal:true});setTimeout(()=>{try{conn.close()}catch(e){}},600);flashMsg(`${name} 的遊戲是舊版本，已請他重新整理後再加入`);return}
    NET.conns.set(conn.peer,{conn,pid});

      let s=doc.seats.find(x=>x.uid===pid);
      if(s)s.nick=name;
      else{const i=doc.seats.findIndex(x=>x.type==='open');
        if(i<0){sendTo(conn,{t:'err',msg:'房間已滿。',fatal:true});NET.conns.delete(conn.peer);setTimeout(()=>{try{conn.close()}catch(e){}},500);return}
        doc.seats[i]={uid:pid,nick:name,type:'human'};

  }
  const c=NET.conns.get(conn.peer);if(!c)return;const pid=c.pid;

    if(doc.status==='lobby'){const i=doc.seats.findIndex(x=>x.uid===pid);if(i>0)doc.seats[i]={uid:null,nick:'',type:'open'}}

}
function sanitize(a){
  if(a.type==='take')return{type:'take',cols:a.cols.slice(0,3)};
  if(a.type==='buy')return{type:'buy',src:a.src,t:+a.t,idx:+a.idx};
  if(a.type==='reserve')return{type:'reserve',t:+a.t,idx:+a.idx};

function validAction(i,a){
  if(!a||typeof a!=='object')return false;const p=P(i);
  if(a.type==='take'){
    const cols=a.cols;if(!Array.isArray(cols)||!cols.length||cols.length>3||!cols.every(k=>C.includes(k)))return false;
    if(cols.length===2&&cols[0]===cols[1])return G.bank[cols[0]]>=4;

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function cardHTML(c,attrs,opt={}){

let CUE_AC=null;
function chime(){try{CUE_AC=CUE_AC||new (window.AudioContext||window.webkitAudioContext)();const ac=CUE_AC;if(ac.state==='suspended')ac.resume();const t=ac.currentTime;[[880,0],[1318.5,.12]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.12,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.45);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.5)})}catch(e){}}
function turnCue(){
  const mine=G&&!G.over&&(myTurn()||myDiscard());
  const base='星晶守護者';const want=mine?'▶ 輪到你｜'+base:base;
  if(document.title!==want)document.title=want;
  if(!mine||UI.announced===G.turnId)return;
  UI.announced=G.turnId;
  const humans=G.players.filter(p=>p.type==='human').length;
  const who=MODE==='local'&&humans>1?`輪到 ${esc(P(G.cur).name)}`:'輪到你了';
  let b=document.getElementById('turnbanner');if(b)b.remove();
  b=document.createElement('div');b.id='turnbanner';b.innerHTML=`<div class="tb-in"><small>第 ${G.round} 輪</small><b>${who}</b></div>`;
  document.body.appendChild(b);setTimeout(()=>b.remove(),1900);
  if(UI.interacted){chime();try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}}
}
document.addEventListener('pointerdown',()=>{UI.interacted=true},{capture:true});
function renderOverlay(){
  let ov=document.getElementById('ov');
  const html=overlayHTML();
  if(!html){if(ov)ov.remove();return}
  const ae=document.activeElement;const keep=ae&&ov&&ov.contains(ae)&&ae.id?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='ov';document.body.appendChild(ov)}
  ov.innerHTML=html;
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}
function rulesHTML(){return `<div class="sheet"><h2>遊戲規則</h2><div class="sub">約 20–30 分鐘・2–4 人・可混搭真人與電腦</div><div class="rules">

       <input id="seatname${i}" value="${esc(s.name)}" maxlength="8" data-seat="${i}" aria-label="玩家 ${i+1} 名稱">
       <select id="seatkind${i}" data-seatk="${i}" aria-label="玩家 ${i+1} 類型">${[['human','真人（同機輪流）'],['ai1','電腦・簡單'],['ai2','電腦・普通'],['ai3','電腦・困難']].map(([v,t])=>`<option value="${v}"${s.kind===v?' selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</div>
     <div class="note" style="margin-top:10px">第 1 位玩家先手。多位真人時，在同一台裝置輪流操作。</div>
     <div class="acts">${cancel}${saved&&!saved.over&&!(G&&MODE==='local')?'<button class="btn" data-act="resume">繼續上一局</button>':''}<button class="btn" data-act="rules">規則</button><button class="btn primary" data-act="start">開始遊戲</button></div>`;
  }else{
    body=onlineMenuHTML()+`<div class="acts">${cancel}<button class="btn" data-act="rules">規則</button></div>`;
  }
  return `<div class="sheet setup"><h2>星晶守護者</h2><div class="sub">收集五色晶石，招募英雄，解放據點，奪取星核。<span style="float:right;font-family:var(--fn);color:var(--dim)">版本 ${APP_VER}</span></div>${tabs}${body}</div>`;
}
function onlineMenuHTML(){
  const m=UI.menu;const h=loadHost();const lr=lastRoom();
  const resume=(h?`<div class="roomrow"><span class="rc">${esc(h.code)}</span><span class="rm">你主持的房間${h.G&&!h.G.over?'・對局進行中':''}${h.G&&h.G.ver!==APP_VER?'（舊版牌組，開新局才會套用新內容）':''}</span><button class="btn sm" data-act="resumehost">繼續主持</button></div>`:'')+
    (lr&&(!h||h.code!==lr)?`<div class="roomrow"><span class="rc">${esc(lr)}</span><span class="rm">上次加入的房間</span><button class="btn sm" data-act="joinlast">回到房間</button></div>`:'');
  return `${hasPeer()?'':'<div class="errmsg" style="margin:0 0 10px">連線元件載入失敗，請確認網路後重新整理頁面。</div>'}
   <div class="sublab">你的暱稱</div><div class="fld"><input id="nick" maxlength="10" value="${esc(nick())}" data-nick="1" aria-label="暱稱"></div>
   <div class="grp"><div class="sublab">建立房間（你的頁面當主機）</div><div class="fld"><div class="seg">${[2,3,4].map(n=>`<button class="${m.cap===n?'on':''}" data-act="cap" data-n="${n}">${n} 人</button>`).join('')}</div><button class="btn primary" data-act="create">建立房間</button></div></div>
   <div class="grp"><div class="sublab">輸入房號加入</div><div class="fld"><input id="joincode" class="code" maxlength="4" placeholder="ABCD" value="${esc(m.code||'')}" data-code="1" aria-label="房號"><button class="btn" data-act="join">加入</button></div></div>
   ${NET.err?`<div class="errmsg">${esc(NET.err)}</div>`:''}
   ${resume?`<div class="grp"><div class="sublab">我的房間</div><div class="rooms">${resume}</div></div>`:''}
   <div class="note" style="margin-top:14px">玩家之間直接連線，不需要帳號。朋友打開同一個網址，輸入房號或點你傳的邀請連結就能加入。</div>`;
}
function lobbyHTML(){
  const d=NET.doc;const host=NET.role==='host';
  const filled=d.seats.filter(s=>s.type!=='open').length;
  const seats=d.seats.map((s,i)=>{
    let who,ctl='';
    if(s.type==='human'){who=`<span class="dot${isOnline(s.uid)?' on':''}"></span><span class="nm">${esc(s.nick||'玩家')}</span>${s.uid===d.host?'<span class="tagx">房主</span>':''}${s.uid===NET.myId?'<span class="tagx">你</span>':''}`;
      if(host&&i>0)ctl=`<button class="btn sm" data-act="kick" data-i="${i}">移出</button>`}
    else{who=`<span class="nm" style="color:${s.type==='open'?'var(--dim)':'var(--text)'}">${s.type==='open'?'空位・等待玩家加入':esc(s.nick)}</span>`;
      if(host)ctl=`<select id="lseat${i}" data-lseat="${i}" aria-label="座位 ${i+1}">${[['open','空位'],['ai1','電腦・簡單'],['ai2','電腦・普通'],['ai3','電腦・困難']].map(([v,t])=>`<option value="${v}"${(s.type==='open'&&v==='open')||(s.type==='ai'&&v==='ai'+s.level)?' selected':''}>${t}</option>`).join('')}</select>`}
    return `<div class="lseat"><span class="no">${i+1}</span>${who}${ctl}</div>`}).join('');
  return `<div class="sheet setup"><div class="sublab">線上房間</div>
   <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="bigcode" id="roomcode">${esc(d.code)}</span><button class="btn sm" data-act="copycode">複製房號</button><button class="btn sm" data-act="copylink">複製邀請連結</button></div>
   <div class="note" style="margin-top:8px">${NET.status?`<span class="warn">${esc(NET.status)}</span><br>`:''}把房號或邀請連結傳給朋友，他們打開這個網址就能加入。${host?'你是主機，對局中請保持這個頁面開著。':''}</div>
   <div class="note" id="linktext" style="margin-top:6px;word-break:break-all;font-size:11.5px;color:var(--dim)">${esc(inviteLink(d.code))}</div>
   <div style="margin-top:10px">${seats}</div>
   ${UI.toast?`<div class="note" style="margin-top:8px;color:var(--ok)">${esc(UI.toast)}</div>`:''}
   <div class="acts"><button class="btn" data-act="leavegame">${host?'關閉房間':'離開房間'}</button>${host?`<button class="btn primary" data-act="ostart" ${filled>=2?'':'disabled'}>開始遊戲（${filled} 人）</button>`:'<span class="note" style="align-self:center">等待房主開始…</span>'}</div></div>`;
}

// ---------- events ----------
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.seat!==undefined&&UI.menu)UI.menu.seats[+t.dataset.seat].name=t.value;
  if(t.dataset.nick){setNick(t.value.trim())}
  if(t.dataset.code&&UI.menu){UI.menu.code=t.value.toUpperCase()}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.seatk!==undefined&&UI.menu)UI.menu.seats[+t.dataset.seatk].kind=t.value;
  if(t.dataset.lseat!==undefined)hostSetSeat(+t.dataset.lseat,t.value);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='ret'){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.code){e.preventDefault();guestJoin(e.target.value)}
  if(e.key==='Escape'&&(UI.sheet||UI.rules)){UI.sheet=null;UI.rules=false;renderOverlay()}
});
document.addEventListener('click',e=>{
  const ovEl=document.getElementById('ov');
  if(ovEl&&e.target===ovEl&&(UI.sheet||UI.rules)){UI.sheet=null;UI.rules=false;renderOverlay();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  switch(a){
    case 'tok':toggleTok(el.dataset.k);break;
    case 'clr':UI.sel=[];render();break;
    case 'take':if(myTurn()&&UI.sel.length)act({type:'take',cols:UI.sel.slice()});break;
    case 'card':UI.sheet={kind:'card',src:'m',t:+el.dataset.t,i:+el.dataset.i};renderOverlay();break;
    case 'rcard':UI.sheet={kind:'card',src:'r',i:+el.dataset.i};renderOverlay();break;
    case 'deck':if(G.decks[+el.dataset.t].length){UI.sheet={kind:'deck',t:+el.dataset.t};renderOverlay()}break;
    case 'close':UI.sheet=null;renderOverlay();break;
    case 'buy':{const s=UI.sheet;if(!myTurn()||!s)break;const p=P(G.cur);const c=s.src==='m'?G.market[s.t][s.i]:p.reserved[s.i];if(c&&canAfford(p,c))act({type:'buy',src:s.src,t:s.t||c.tier,idx:s.i});break}
    case 'res':{const s=UI.sheet;if(myTurn()&&s&&P(G.cur).reserved.length<MAXRES)act({type:'reserve',t:s.t,idx:s.i});break}
    case 'rdeck':{const s=UI.sheet;if(myTurn()&&s&&P(G.cur).reserved.length<MAXRES)act({type:'reserve',t:s.t,idx:-1});break}
    case 'ret':{if(!myDiscard())break;const k=el.dataset.k;if(MODE==='online'&&NET.role==='guest'){guestSend({t:'ret',k});render();break}if(MODE==='online'){returnToken(k);break}const p=P(G.cur);if(p.tokens[k]>0){p.tokens[k]--;G.bank[k]++;if(tokTotal(p)<=MAXTOK){addLog(`${nm(p)} 歸還晶石至 10 顆`);finishTurn(G.cur)}else render()}break}
    case 'hint':{const d=aiDecide(G.cur);UI.hint=hintText(d);render();break}
    case 'pass':if(myTurn())act({type:'pass'});break;
    case 'takeover':takeover(+el.dataset.i);break;
    case 'rules':UI.rules=true;renderOverlay();break;
    case 'closerules':UI.rules=false;renderOverlay();break;
    case 'menu':UI.menu={tab:'local',seats:G?G.players.map(p=>({name:p.name,kind:p.type==='human'?'human':'ai'+p.level})):defaultSeats(2),cap:2};renderOverlay();break;
    case 'closemenu':UI.menu=null;renderOverlay();break;
    case 'tab':UI.menu.tab=el.dataset.tab;NET.err='';renderOverlay();break;
    case 'again':UI.menu={tab:'local',seats:G.players.map(p=>({name:p.name,kind:p.type==='human'?'human':'ai'+p.level})),cap:2};renderOverlay();break;
    case 'viewboard':UI.viewBoard=true;render();break;
    case 'pcount':{const n=+el.dataset.n;const cur=UI.menu.seats;UI.menu.seats=defaultSeats(n).map((s,i)=>cur[i]||s);renderOverlay();break}
    case 'cap':UI.menu.cap=+el.dataset.n;renderOverlay();break;
    case 'resume':{const g=loadSave();if(g){MODE='local';G=g;UI.menu=null;UI.anim=new Set();UI.viewBoard=false;UI.lastHuman=Math.max(0,G.players.findIndex(p=>p.type==='human'));render();schedule()}break}
    case 'start':{const seats=UI.menu.seats.map((s,i)=>({name:(s.name||'').trim()||`玩家${i+1}`,type:s.kind==='human'?'human':'ai',level:s.kind==='human'?0:+s.kind.slice(2)}));UI.menu=null;clearTimeout(timer);MODE='local';newGame(seats);save();render();schedule();break}
    case 'create':hostCreate(UI.menu.cap||2);break;
    case 'join':{const v=(document.getElementById('joincode')||{}).value;guestJoin(v);break}
            case 'leavegame':leaveRoom();break;
    case 'ostart':hostStart();break;
    case 'kick':hostKick(+el.dataset.i);break;
    case 'resumehost':{const h=loadHost();if(h)openHost(h.code,h.doc,h.G,true);break}
    case 'joinlast':guestJoin(lastRoom());break;
    case 'copylink':{const link=inviteLink(NET.doc.code);const done=()=>{UI.toast='已複製邀請連結';renderOverlay();setTimeout(()=>{UI.toast='';renderOverlay()},2500)};try{navigator.clipboard.writeText(link).then(done,()=>{selText('linktext');UI.toast='請手動複製上方連結';renderOverlay()})}catch(err){selText('linktext')}break}
    case 'rematch':rematch();break;
    case 'copycode':{const code=NET.doc&&NET.doc.code;const done=()=>{UI.toast='已複製房號 '+code;renderOverlay();setTimeout(()=>{UI.toast='';renderOverlay()},2500)};
      try{navigator.clipboard.writeText(code).then(done,()=>{selectCode();UI.toast='請手動複製房號';renderOverlay()})}catch(err){selectCode()}break}
  }
});
function selText(id){const el=document.getElementById(id);if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function selectCode(){const el=document.getElementById('roomcode');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function hintText(d){
  if(!d)return '';
  if(d.type==='buy')return `建議：<b>招募 ${d.why.c.name}</b>（${d.src==='r'?'保留區':'場上'}）`;
  if(d.type==='take'){const t=d.cols.length===2&&d.cols[0]===d.cols[1]?`2 顆${CN[d.cols[0]]}`:d.cols.map(k=>CN[k]).join('、');return `建議：<b>拿取 ${t}</b>${d.why?`，瞄準 ${d.why.c.name}`:''}`}
  if(d.type==='reserve')return `建議：<b>保留 ${d.why?d.why.c.name:'一張卡'}</b>，同時拿星塵`;
  return '目前沒有好的行動，只能跳過。';
}

function boot(){
  const saved=loadSave();
  if(saved&&!saved.over){G=saved;UI.lastHuman=Math.max(0,G.players.findIndex(p=>p.type==='human'));for(const t of [1,2,3])G.market[t].forEach(c=>c&&UI.anim.add(c.id));G.players.forEach(p=>p.reserved.forEach(c=>UI.anim.add(c.id)));UI.menu={tab:'local',seats:G.players.map(p=>({name:p.name,kind:p.type==='human'?'human':'ai'+p.level})),cap:2};render();return}
  newGame([{name:'你',type:'human',level:0},{name:'星語',type:'ai',level:2}]);
  UI.menu={tab:'local',seats:defaultSeats(2),cap:2};
  render();
}
boot();
(()=>{const q=new URLSearchParams(location.search);const r=(q.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(r.length===4){const h=loadHost();if(h&&h.code===r){openHost(h.code,h.doc,h.G,true)}else if(lastRoom()===r&&hasPeer()){guestJoin(r)}else{UI.menu={tab:'online',seats:defaultSeats(2),cap:2,code:r};NET.err='';render();}}})();
window.addEventListener('beforeunload',e=>{if(NET.role==='host'&&G&&!G.over){e.preventDefault();e.returnValue=''}});
})();
</script>

</body>
</html>
